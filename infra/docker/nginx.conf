server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass $api;
    }

    location /actuator/health {
        proxy_pass $api;
    }

    location = /favicon.ico {
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 413 = @too_large;
    location @too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content too large","status":413,"detail":"Request body exceeds the 8 KiB gateway limit."}';
    }

    error_page 502 504 = @unavailable;
    location @unavailable {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service unavailable","status":503,"detail":"The API is unavailable. Check the local stack and retry."}';
    }
}
