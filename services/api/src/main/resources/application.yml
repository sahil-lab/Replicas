spring:
  application:
    name: replicas-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 1500
      validation-timeout: 1000
  jdbc:
    template:
      query-timeout: 2s
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    threads:
      max: 20
      min-spare: 2
    connection-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs
